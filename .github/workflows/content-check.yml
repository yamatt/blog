---
name: Check New Posts

on:
  pull_request:
    branches:
      - main
    paths:
      - "content/**.md"

jobs:
  markdownlint:
    name: Check markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm ci --include dev
      - name: Test content with markdownlint
        run: |
          npx markdownlint --config ./markdownlint.config.json content/**.md
  test-language:
    name: Test for biased language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm ci --include dev
      - name: Test content with alex
        run: |
          alex content/**.md
  test-complexity:
    name: Get report on language complexity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: "auto"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Find changed files
        id: changed-files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            content:
              - 'content/**.md'
      - name: Get language complexity report
        id: complexity-report
        run: |
          uv run textstat_cli ${{ steps.changed-files.outputs.content_files }}
      - name: Add comment to PR
        uses: mshick/add-pr-comment@v3
        with:
          message: ${{ steps.complexity-report.outputs.stdout }}
  grammar-check:
    name: Use write-good to check usage of language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm ci --include dev
      - name: Test content with write-good
        continue-on-error: true
        run: |
          write-good --parse content/**.md

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baml-py>=0.226.2",
    "click>=8.5.0",
    "typing_extensions>=4.12.0",
    "pydantic>=2.8.0",
]

[project.scripts]
copyeditor = "copyeditor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copyeditor", "baml_client"]

[dependency-groups]
dev = ["hemoglobin>=0.0.11", "textstat-cli>=1.1.3"]
